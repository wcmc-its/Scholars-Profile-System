version: 2

# Dependabot version-update config.
#
# Rationale: #475 surfaced the node20 -> node24 runner-runtime deprecation by
# hand, against a hard 2026-06-02 cutoff. With this config Dependabot opens a
# grouped PR whenever a pinned action has a newer release, so the next runtime
# deprecation (or action CVE) appears as a reviewable PR well ahead of any
# deadline -- no manual sweep of .github/workflows/*.
#
# npm (root app + cdk/): the app is live, so upgrades now arrive weekly in small
# grouped steps instead of piling up into a large backlog. Minor+patch land as
# one PR per directory; majors as a second PR, since they usually need code
# changes (e.g. vitest 3 -> 5). CVE-driven security PRs are grouped into one PR
# per directory. No `ignore` rules: they can also suppress security updates.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"
      npm-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
      npm-major:
        applies-to: version-updates
        update-types:
          - "major"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "npm"
    directory: "/cdk"
    schedule:
      interval: "weekly"
    groups:
      cdk-security:
        applies-to: security-updates
        patterns:
          - "*"
      cdk-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
      cdk-major:
        applies-to: version-updates
        update-types:
          - "major"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps-cdk)"

  # Dockerfile base image (node:<major>-bookworm-slim@sha256:...). The digest is
  # pinned for reproducible builds; this bumps it weekly so base-image security
  # patches still arrive, as a reviewable PR.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(docker)"
