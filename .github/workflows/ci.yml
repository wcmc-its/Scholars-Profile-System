name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Read-only token. CI installs ~1,000 npm packages; none of them needs to write
# to the repo. Jobs that need more must ask for it explicitly.
permissions:
  contents: read

jobs:
  # The app checks run as three parallel jobs, so a pull request waits for the
  # slowest of them (the unit tests) rather than for their sum. `build` below
  # is the single required status check that gates on all three.
  static:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Keep in step with the Dockerfile base image.
          node-version: "26"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Validate OpenAPI spec
        # Pinned: an unpinned @latest runs whatever was published most recently.
        run: npx --yes @redocly/cli@2.62.1 lint openapi.yaml --format=github-actions

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Audit DB writes
        run: npm run audit:db-writes

  test:
    runs-on: ubuntu-latest

    env:
      # No database behind it: the unit tests never query one. They ran before
      # the migrations when this was one job, against an empty schema.
      DATABASE_URL: mysql://scholars:scholars@127.0.0.1:3306/scholars

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

  app-build:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: scholars
          MYSQL_USER: scholars
          MYSQL_PASSWORD: scholars
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DATABASE_URL: mysql://scholars:scholars@127.0.0.1:3306/scholars

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Apply Prisma migrations
        run: npx prisma migrate deploy

      - name: Build
        run: npm run build

  # Branch protection requires a check named `build`. Keep that name here so
  # the rule needs no change. `if: always()` makes this job report even when a
  # job it needs failed; without it the job would be skipped, and a skipped
  # required check counts as passing.
  build:
    if: always()
    needs: [static, test, app-build]
    runs-on: ubuntu-latest

    steps:
      - name: All app checks passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "static, test, app-build: $RESULTS"
          for r in $RESULTS; do
            [ "$r" = "success" ] || exit 1
          done

  cdk:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: cdk/package-lock.json

      - name: Install CDK dependencies
        run: npm ci
        working-directory: cdk

      - name: Lint
        run: npm run lint
        working-directory: cdk

      - name: Type-check
        run: npm run typecheck
        working-directory: cdk

      - name: Test
        run: npm test
        working-directory: cdk

      # cdk's jest testMatch is <rootDir>/test/** only, so it never reaches the
      # lambda workspaces — they are vitest (ESM, NodeNext ".js" specifiers,
      # vi.mock/vi.stubGlobal) and cannot be collected by ts-jest's CJS resolver.
      # Run them where they live instead of porting them (#2193).
      - name: Lambda workspace tests
        run: npm run test --workspaces --if-present
        working-directory: cdk

      - name: Flag parity (code vs cdk wiring)
        run: node scripts/release/flag-parity.mjs

      - name: Synth (staging)
        run: npm run synth -- -c env=staging
        working-directory: cdk

      # allowLatestAppImage: Sps-App-prod carries an error annotation without
      # -c appImageDigest (#2343), and `cdk synth` validates every stack. CI has
      # no running digest to pass; it only checks that the app synthesizes.
      - name: Synth (prod)
        run: npm run synth -- -c env=prod -c allowLatestAppImage=true
        working-directory: cdk
