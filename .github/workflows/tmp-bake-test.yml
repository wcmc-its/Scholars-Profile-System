# TEMPORARY: proves the deploy workflow's parallel image build on a GitHub
# runner without deploying. Removed before merge.
name: tmp bake test
on:
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  bake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build images (same commands as deploy.yml)
        run: |
          set -euo pipefail
          docker buildx version
          docker buildx ls
          APP_URI="example.invalid/scholars-app"
          ETL_URI="example.invalid/scholars-etl"
          SHA="${{ github.sha }}"
          ISR_CACHE_S3="on"
          jq -n --arg app "$APP_URI" --arg etl "$ETL_URI" --arg sha "$SHA" --arg isr "$ISR_CACHE_S3" '{
            target: {
              app: {
                context: ".",
                args: { NEXT_DEPLOYMENT_ID: $sha, NEXT_ISR_CACHE_S3: $isr },
                tags: ["\($app):\($sha)", "\($app):latest"]
              },
              etl: {
                context: ".",
                target: "etl",
                tags: ["\($etl):\($sha)", "\($etl):latest"]
              }
            }
          }' > "$RUNNER_TEMP/bake.json"
          targets=(app)
          if [ -n "$ETL_URI" ]; then targets+=(etl); fi
          docker buildx bake -f "$RUNNER_TEMP/bake.json" "${targets[@]}"
      - name: Both images are in the local store, and static assets copy out
        run: |
          set -euo pipefail
          docker image ls | grep example.invalid
          test "$(docker image ls -q "example.invalid/scholars-app:${{ github.sha }}" | wc -l)" = 1
          test "$(docker image ls -q "example.invalid/scholars-etl:${{ github.sha }}" | wc -l)" = 1
          cid=$(docker create "example.invalid/scholars-app:${{ github.sha }}")
          docker cp "$cid:/app/.next/static" /tmp/next-static
          find /tmp/next-static -type f | wc -l
          docker run --rm --entrypoint sh "example.invalid/scholars-etl:${{ github.sha }}" -c 'ls etl | wc -l && ls node_modules/.bin/tsx'
