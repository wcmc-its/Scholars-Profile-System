<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1540 770" width="1540" height="770" role="img" aria-labelledby="t-matching-engines d-matching-engines" font-family="Inter,-apple-system,Segoe UI,Helvetica,Arial,sans-serif"><title id="t-matching-engines">Matching surfaces &amp; engines</title><desc id="d-matching-engines">The three grant-matching surfaces and the engine each one rides: Grant Matcha's seeded ask and /edit/matcha's plain ask share the people spine (LLM extraction → cluster retrieval → RRF fuse), the dark grants target awaits a UI consumer, and the self-service card uses the no-LLM forward matcher over the opportunities index plus the scholar's Aurora topics and MeSH fingerprint. The route persists each people-target answer in Aurora and replays it with an asOf date until Re-run. Eligibility is deliberately split: “what a grant requires” is extracted upstream by ReciterAI; “does this researcher qualify” is the client-side rail — the single owner since the find-researchers sunset, fed by the esiEligible signal the people spine derives from Aurora on the grant-matcha path only.</desc><rect width="100%" height="100%" fill="#fbfcfe"/><defs><filter id="sh" x="-25%" y="-25%" width="150%" height="150%"><feDropShadow dx="0" dy="1.4" stdDeviation="2.4" flood-color="#0b1f3a" flood-opacity="0.14"/></filter><marker id="mGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,0.8 L9.4,5 L0.5,9.2 L3,5 Z" fill="#868e96"/></marker><marker id="mMaroon" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,0.8 L9.4,5 L0.5,9.2 L3,5 Z" fill="#7d1c1c"/></marker><marker id="mRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,0.8 L9.4,5 L0.5,9.2 L3,5 Z" fill="#e03131"/></marker><marker id="mGreen" view