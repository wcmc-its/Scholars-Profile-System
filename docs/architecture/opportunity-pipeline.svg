"9" fill="#ffffff" stroke="#868e96" stroke-opacity="0.45"/><text x="640" y="689.4" font-size="10" fill="#3a434f" text-anchor="middle">CloudWatch logs · metric filter</text><rect x="1316.45" y="233.5" width="47.099999999999994" height="18" rx="9" fill="#ffffff" stroke="#0ca678" stroke-opacity="0.45"/><text x="1340" y="246.4" font-size="10" fill="#3a434f" text-anchor="middle">upsert</text><rect x="1313.525" y="327.5" width="52.949999999999996" height="18" rx="9" fill="#ffffff" stroke="#0ca678" stroke-opacity="0.45"/><text x="1340" y="340.4" font-size="10" fill="#3a434f" text-anchor="middle">rebuild</text><rect x="1114.125" y="326.5" width="99.75" height="18" rx="9" fill="#ffffff" stroke="#868e96" stroke-opacity="0.45"/><text x="1164" y="339.4" font-size="10" fill="#3a434f" text-anchor="middle">emit ingest age</text><g><rect x="42" y="105" width="64.19999999999999" height="26" rx="8" fill="#ffffff" stroke="#adb5bd" stroke-width="1.2"/><text x="74.1" y="122.5" font-size="12" font-weight="700" fill="#343a40" text-anchor="middle">Sources</text></g><g><rect x="416" y="105" width="308.4" height="26" rx="8" fill="#ffffff" stroke="#0ca678" stroke-width="1.2"/><text x="570.2" y="122.5" font-size="12" font-weight="700" fill="#0b6e4f" text-anchor="middle">Fargate · reciterai-grants (daily 03:00 UTC)</text></g><g><rect x="826" y="105" width="150" height="26" rx="8" fill="#ffffff" stroke="#f08c00" stroke-width="1.2"/><text x="901" y="122.5" font-size="12" font-weight="700" fill="#8a5a00" text-anchor="middle">Shared corpus stores</text></g><g><rect x="826" y="425" width="136.8" height="26" rx="8" fill="#ffffff" stroke="#7048e8" stroke-width="1.2"/><text x="894.4" y="442.5" font-size="12" font-weight="700" fill="#4a2fb0" text-anchor="middle">Producer guardrail</text></g><g><rect x="1188" y="105" width="130.2" height="26" rx="8" fill="#ffffff" stroke="#7d1c1c" stroke-width="1.2"/><text x="1253.1" y="122.5" font-size="12" font-weight="700" fill="#5e1414" text-anchor="middle">SPS · nightly ETL</text></g><g><rect x="1188" y="449" width="249" height="26" rx="8" fill="#ffffff" stroke="#7048e8" stroke-width="1.2"/><text x="1312.5" y="466.5" font-size="12" font-weight="700" fill="#4a2fb0" text-anchor="middle">Freshness guardrail · SPS etl-stack</text></g><g><title>Grants.gov API — public POST · paginated to hitCount</title><rect x="40" y="168" width="288" height="56" rx="10" fill="#f1f3f5" stroke="#adb5bd" stroke-width="1.6" filter="url(#sh)"/><rect x="52" y="183" width="9" height="9" rx="2.5" fill="#868e96"/><text x="68" y="192" font-size="13.5" font-weight="700" fill="#343a40">Grants.gov API</text><text x="54" y="209" font-size="11" fill="#5b6470">public POST · paginated to hitCount</text><rect x="274.5" y="178" width="43.5" height="17" rx="8.5" fill="#e7f6ef"/><text x="296.25" y="190" font-size="10" font-weight="700" fill="#157a52" text-anchor="middle">daily</text></g><g><title>SPIN ProgramSearch — 113 target funders (spon_code); creds are query params — never logged</title><rect x="40" y="244" width="288" height="62" rx="10" fill="#f1f3f5" stroke="#adb5bd" stroke-width="1.6" filter="url(#sh)"/><rect x="52" y="259" width="9" height="9" rx="2.5" fill="#868e96"/><text x="68" y="268" font-size="13.5" font-weight="700" fill="#343a40">SPIN ProgramSearch</text><text x="54" y="285" font-size="11" fill="#5b6470">113 target funders (spon_code)</text><text x="54" y="300" font-size="11" fill="#5b6470">creds are query params — never logged</text><rect x="268.6" y="254" width="49.400000000000006" height="17" rx="8.5" fill="#f1f3f5"/><text x="293.3" y="266" font-size="10" font-weight="700" fill="#5b6470" text-anchor="middle">manual</text></g><g><title>WCM funding-DB CSV — ingest_curated · source frozen</title><rect x="40" y="326" width="288" height="56" rx="10" fill="#f1f3f5" stroke="#adb5bd" stroke-width="1.6" filter="url(#sh)"/><rect x="52" y="341" width="9" height="9" rx="2.5" fill="#868e96"/><text x="68" y="350" font-size="13.5" font-weight="700" fill="#343a40">WCM funding-DB CSV</text><text x="54" y="367" font-size="11" fill="#5b6470">ingest_curated · source frozen</text><rect x="268.6" y="336" width="49.400000000000006" height="17" rx="8.5" fill="#f1f3f5"/><text x="293.3" y="348" font-size="10" font-weight="700" fill="#5b6470" text-anchor="middle">frozen</text></g><g><title>fetch + normalize — one opportunity shape from any source</title><rect x="420" y="168" width="320" height="56" rx="10" fill="#e3faf3" stroke="#0ca678" stroke-width="1.6" filter="url(#sh)"/><rect x="432" y="183" width="9" height="9" rx="2.5" fill="#0ca678"/><text x="448" y="192" font-size="13.5" font-weight="700" fill="#0b6e4f">fetch + normalize</text><text x="434" y="209" font-size="11" fill="#5b6470">one opportunity shape from any source</text></g><g><title>dedupe + exclusions — corpus-key index · excluded_opportunities</title><rect x="420" y="244" width="320" height="56" rx="10" fill="#e3faf3" stroke="#0ca678" stroke-width="1.6" filter="url(#sh)"/><rect x="432" y="259" width="9" height="9" rx="2.5" fill="#0ca678"/><text x="448" y="268" font-size="13.5" font-weight="700" fill="#0b6e4f">dedupe + exclusions</text><text x="434" y="285" font-size="11" fill="#5b6470">corpus-key index · excluded_opportunities</text></g><g><title>noise gates — project_type allow-list · geo non-US</title><rect x="420" y="320" width="320" height="56" rx="10" fill="#e3faf3" stroke="#0ca678" stroke-width="1.6" filter="url(#sh)"/><rect x="432" y="335" width="9" height="9" rx="2.5" fill="#0ca678"/><text x="448" y="344" font-size="13.5" font-weight="700" fill="#0b6e4f">noise gates</text><text x="434" y="361" font-size="11" fill="#5b6470">project_type allow-list · geo non-US</text></g><g><title>Bedrock judge / scorer — is_research · biomedical relevance · topics</title><rect x="420" y="396" width="320" height="62" rx="10" fill="#f0ebff" stroke="#7048e8" stroke-width="1.6" filter="url(#sh)"/><rect x="432" y="411" width="9" height="9" rx="2.5" fill="#7048e8"/><text x="448" y="420" font-size="13.5" font-weight="700" fill="#4a2fb0">Bedrock judge / scorer</text><text x="434" y="437" font-size="11" fill="#5b6470">is_research · biomedical relevance · topics</text></g><g><title>persist — incremental DynamoDB flush, per item</title><rect x="420" y="482" width="320" height="56" rx="10" fill="#e3faf3" stroke="#0ca678" stroke-width="1.6" filter="url(#sh)"/><rect x="432" y="497" width="9" height="9" rx="2.5" fill="#0ca678"/><text x="448" y="506" font-size="13.5" font-weight="700" fill="#0b6e4f">persist</text><text x="434" y="523" font-size="11" fill="#5b6470">incremental DynamoDB flush, per item</text></g><g><title>submission drain — ingest_submissions · DynamoDB-only; never publishes the S3 artifact</title><rect x="420" y="558" width="320" height="62" rx="10" fill="#e3faf3" stroke="#0ca678" stroke-width="1.6" filter="url(#sh)"/><rect x="432" y="573" width="9" height="9" rx="2.5" fill="#0ca678"/><text x="448" y="582" font-size="13.5" font-weight="700" fill="#0b6e4f">submission drain</text><text x="434" y="599" font-size="11" fill="#5b6470">ingest_submissions · DynamoDB-only</text><text x="434" y="614" font-size="11" fill="#5b6470">never publishes the S3 artifact</text></g><g><title>DynamoDB · reciterai — GRANT# corpus items; SUBMISSION intake queue (from SPS /edit)</title><rect x="830" y="168" width="300" height="84" rx="10" fill="#fff4d6" stroke="#f08c00" stroke-width="1.6" filter="url(#sh)"/><rect x="842" y="183" width="9" height="9" rx="2.5" fill="#f08c00"/><text x="858" y="192" font-size="13.5" font-weight="700" fill="#8a5a00">DynamoDB · reciterai</text><text x="844" y="209" font-size="11" fill="#5b6470">GRANT# corpus items</text><text x="844" y="224" font-size="11" fill="#5b6470">SUBMISSION intake queue (from SPS /edit)</text></g><g><title>S3 · grants/latest — sweep-only publish · shrink guard refuses; a &gt;20% count drop (force=True escape)</title><rect x="830" y="300" width="300" height="72" rx="10" fill="#fff4d6" stroke="#f08c00" stroke-width="1.6" filter="url(#sh)"/><rect x="842" y="315" width="9" height="9" rx="2.5" fill="#f08c00"/><text x="858" y="324" font-size="13.5" font-weight="700" fill="#8a5a00">S3 · grants/latest</text><text x="844" y="341" font-size="11" fill="#5b6470">sweep-only publish · shrink guard refuses</text><text x="844" y="356" font-size="11" fill="#5b6470">a &gt;20% count drop (force=True escape)</text></g><g><title>Log-error alarm — reciterai-grants-ingest-errors; ERROR / Traceback / ShrinkError lines; -&gt; SNS email topic (confirmed subscribers)</title><rect x="830" y="470" width="300" height="78" rx="10" fill="#f0ebff" stroke="#7048e8" stroke-width="1.6" filter="url(#sh)"/><rect x="842" y="485" width="9" height="9" rx="2.5" fill="#7048e8"/><text x="858" y="494" font-size="13.5" font-weight="700" fill="#4a2fb0">Log-error alarm</text><text x="844" y="511" font-size="11" fill="#5b6470">reciterai-grants-ingest-errors</text><text x="844" y="526" font-size="11" fill="#5b6470">ERROR / Traceback / ShrinkError lines</text><text x="844" y="541" font-size="11" fill="#5b6470">-&gt; SNS email topic (confirmed subscribers)</text></g><g><title>SPS nightly projection — etl:dynamodb · cron(0 7 * * ? *)</title><rect x="1192" y="168" width="296" height="56" rx="10" fill="#e3faf3" stroke="#0ca678" stroke-width="1.6" filter="url(#sh)"/><rect x="1204" y="183" width="9" height="9" rx="2.5" fill="#0ca678"/><text x="1220" y="192" font-size="13.5" font-weight="700" fill="#0b6e4f">SPS nightly projection</text><text x="1206" y="209" font-size="11" fill="#5b6470">etl:dynamodb · cron(0 7 * * ? *)</text><rect x="1410.9" y="178" width="67.1" height="17" rx="8.5" fill="#e7f6ef"/><text x="1444.45" y="190" font-size="10" font-weight="700" fill="#157a52" text-anchor="middle">07:00 UTC</text></g><g><title>Aurora · opportunity — upsert never names suppress* columns</title><rect x="1192" y="262" width="296" height="56" rx="10" fill="#fff4d6" stroke="#f08c00" stroke-width="1.6" filter="url(#sh)"/><rect x="1204" y="27