<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1540 720" width="1540" height="720" role="img" aria-labelledby="t-opportunity-pipeline d-opportunity-pipeline" font-family="Inter,-apple-system,Segoe UI,Helvetica,Arial,sans-serif"><title id="t-opportunity-pipeline">Opportunity corpus pipeline &amp; freshness</title><desc id="d-opportunity-pipeline">Inside the daily corpus run: every source funnels through one normalize → dedupe → gate → LLM judge → persist chain in the reciterai-grants Fargate task, with the SPS submission drain chained after it. Two independent guardrails watch it: a log-error alarm on the producer (the ; chain means a grants.gov failure never reaches the exit code) and the per-source freshness metric + ≥21-day alarm on the SPS side.</desc><rect width="100%" height="100%" fill="#fbfcfe"/><defs><filter id="sh" x="-25%" y="-25%" width="150%" height="150%"><feDropShadow dx="0" dy="1.4" stdDeviation="2.4" flood-color="#0b1f3a" flood-opacity="0.14"/></filter><marker id="mGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,0.8 L9.4,5 L0.5,9.2 L3,5 Z" fill="#868e96"/></marker><marker id="mMaroon" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,0.8 L9.4,5 L0.5,9.2 L3,5 Z" fill="#7d1c1c"/></marker><marker id="mRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,0.8 L9.4,5 L0.5,9.2 L3,5 Z" fill="#e03131"/></marker><marker id="mGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,0.8 L9.4,5 L0.5,9.2 L3,5 Z" fill="#2f9e44"/></marker><marker id="mIndigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><pat