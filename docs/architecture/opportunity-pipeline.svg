und" marker-end="url(#mTeal)"/><path d="M580,300 C580,336 580,284 580,320" fill="none" stroke="#0ca678" stroke-width="1.8" stroke-linecap="round" marker-end="url(#mTeal)"/><path d="M580,376 C580,412 580,360 580,396" fill="none" stroke="#0ca678" stroke-width="1.8" stroke-linecap="round" marker-end="url(#mTeal)"/><path d="M580,458 C580,494 580,446 580,482" fill="none" stroke="#7048e8" stroke-width="1.8" stroke-linecap="round" marker-end="url(#mViolet)"/><path d="M580,538 C580,574 580,522 580,558" fill="none" stroke="#868e96" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="6 5" marker-end="url(#mGray)"/><path d="M740,504.4 L776,510 L776,240 L830,235.2" fill="none" stroke="#f08c00" stroke-width="1.8" stroke-linecap="round" marker-end="url(#mAmber)"/><path d="M740,526.8 C811.7268177462238,526.8 758.2731822537762,336 830,336" fill="none" stroke="#f08c00" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="6 5" marker-end="url(#mAmber)"/><path d="M740,589 L1158,589 L1158,280 L1085,252" fill="none" stroke="#4263eb" stroke-width="1.8" stroke-linecap="round" marker-end="url(#mIndigo)"/><path d="M1130,243.60000000000002 L1146,244 L1146,608 L740,607.6" fill="none" stroke="#4263eb" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="6 5" marker-end="url(#mIndigo)"/><path d="M580,644 L580,672 L776,672 L776,509 L830,509" fill="none" stroke="#868e96" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="6 5" marker-end="url(#mGray)"/><path d="M1130,210 C1166,210 1156,196 1192,196" fill="none" stroke="#0ca678" stroke-width="1.8" stroke-linecap="round" marker-end="url(#mTeal)"/><path d="M1340,224 C1340,260 1340,226 1340,262" fill="none" stroke="#0ca678" stroke-width="1.8" stroke-linecap="round" marker-end="url(#mTeal)"/><path d="M1340,318 C1340,354 1340,320 1340,356" fill="none" stroke="#0ca678" stroke-width="1.8" stroke-linecap="round" marker-end="url(#mTeal)"/><path d="M1192,212.8 L1164,212 L1164,515 L1192,514.6" fill="none" stroke="#868e96" stroke