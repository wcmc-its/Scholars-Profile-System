7" width="480" height="26" rx="8" fill="#ffffff" stroke="#4263eb" stroke-width="1.2"/><text x="296" y="154.5" font-size="12" font-weight="700" fill="#2b3a8c" text-anchor="middle">Deployed · shared its-reciter-vpc01 (TGW-attached) · 2 AZs · both envs</text></g><g><rect x="86" y="183" width="169.79999999999998" height="26" rx="8" fill="#ffffff" stroke="#4263eb" stroke-width="1.2"/><text x="170.89999999999998" y="200.5" font-size="12" font-weight="700" fill="#2b3a8c" text-anchor="middle">dmz tier · public (IGW)</text></g><g><rect x="466" y="327" width="117" height="26" rx="8" fill="#ffffff" stroke="#4263eb" stroke-width="1.2"/><text x="524.5" y="344.5" font-size="12" font-weight="700" fill="#2b3a8c" text-anchor="middle">app2 tier · /25</text></g><g><rect x="86" y="327" width="103.8" height="26" rx="8" fill="#ffffff" stroke="#f08c00" stroke-width="1.2"/><text x="137.9" y="344.5" font-size="12" font-weight="700" fill="#8a5a00" text-anchor="middle">db tier · /27</text></g><g><rect x="1094" y="183" width="183" height="26" rx="8" fill="#ffffff" stroke="#adb5bd" stroke-width="1.2"/><text x="1185.5" y="200.5" font-size="12" font-weight="700" fill="#343a40" text-anchor="middle">Beyond the VPC · WCM side</text></g><text x="40" y="722" font-size="11" fill="#8a94a6">Public overview — internal network ranges, SG ids and hostnames generalized (masks only). A more detailed version is available on request.</text><g><title>Internet — public</title><rect x="40" y="36" width="120" height="50" rx="10" fill="#f1f3f5" stroke="#adb5bd" stroke-width="1.6" filter="url(#sh)"/><rect x="52" y="51" width="9" height="9" rx="2.5" fill="#868e96"/><text x="68" y="60" font-size="13.5" font-weight="700" fill="#343a40">Internet</text><text x="54" y="77" font-size="11" fill="#5b6470">public</text></g><g><title>CloudFront + AWS WAF — rate-limit · managed rules; WCM-only gate (#461)</title><rect x="180" y="30" width="250" height="66" rx="10" fill="#fbeaea" stroke="#7d1c1c" stroke-width="1.6" filter="url(#sh)"/><rect x="192" y="45" width="9" height="9" rx="2.5" fill="#7d1c1c"/><text x="208" y="54" font-size="13.5" font-weight="700" fill="#5e1414">CloudFront + AWS WAF</text><text x="194" y="71" font-size="11" fill="#5b6470">rate-limit · managed rules</text><text x="194" y="86" font-size="11" fill="#5b6470">WCM-only gate (#461)</text></g><g><title>NetScaler VIP — WCM-run VPX · decision #502; see View ④</title><rect x="600" y="30" width="270" height="66" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.6" filter="url(#sh)"/><rect x="612" y="45" width="9" height="9" rx="2.5" fill="#2f9e44"/><text x="628" y="54" font-size="13.5" font-weight="700" fill="#256f33">NetScaler VIP</text><text x="614" y="71" font-size="11" fill="#5b6470">WCM-run VPX · decision #502</text><text x="614" y="86" font-size="11" fill="#5b6470">see View ④</text><rect x="822.4" y="40" width="37.6" height="17" rx="8.5" fill="#f3eeff"/><text x="841.2" y="52" font-size="10" font-weight="700" fill="#6a40c9" text-anchor="middle">live</text></g><g><title>Outbound internet (via NAT) — X-Ray · Bedrock · Secrets Mgr; NIH RePORTER · NSF · MeSH · PubMed · CT.gov; ORCID · Gates · POPS · CTL · newsroom · honors</title><rect x="1040" y="30" width="340" height="82" rx="10" fill="#f1f3f5" stroke="#adb5bd" stroke-width="1.6" filter="url(#sh)"/><rect x="1052" y="45" width="9" height="9" rx="2.5" fill="#868e96"/><text x="1068" y="54" font-size="13.5" font-weight="700" fill="#343a40">Outbound internet (via NAT)</text><text x="1054" y="71" font-size="11" fill="#5b6470">X-Ray · Bedrock · Secrets Mgr</text><text x="1054" y="86" font-size="11" fill="#5b6470">NIH RePORTER · NSF · MeSH · PubMed · CT.gov</text><text x="1054" y="101" font-size="11" fill="#5b6470">ORCID · Gates · POPS · CTL · newsroom · honors</text></g><g><title>IGW (shared VPC)</title><rect x="865" y="126" width="150" height="44" rx="10" fill="#e7ecff" stroke="#4263eb" stroke-width="1.6" filter="url(#sh)"/><rect x="877" y="141" width="9" height="9" rx="2.5"