<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 735" width="1400" height="735" role="img" aria-labelledby="t-network-topology d-network-topology" font-family="Inter,-apple-system,Segoe UI,Helvetica,Arial,sans-serif"><title id="t-network-topology">Network topology</title><desc id="d-network-topology">The review-ready network picture as deployed. Consolidated (staging 2026-07-02, prod 2026-07-05): both envs run in the shared, TGW-attached its-reciter-vpc01 with no VPC peering, placed in three tiers — dmz (public ALB), app2 /25 (app, every ETL task, internal ALB) and db /27 (Aurora, OpenSearch). Env isolation is by per-env security groups: app / etl / alb pre-provisioned in the shared VPC and imported by id (allow-all egress); aurora / opensearch CDK-owned with SG-to-SG ingress only. The NAT, IGW and VPC endpoints belong to the shared VPC — SPS creates none. The front door is CloudFront + WAF → NetScaler → ALB :443 (live; View ④), and WCM / on-prem sources are reached natively over the TGW (#443 closed).</desc><rect width="100%" height="100%" fill="#fbfcfe"/><defs><filter id="sh" x="-25%" y="-25%" width="150%" height="150%"><feDropShadow dx="0" dy="1.4" stdDeviation="2.4" flood-color="#0b1f3a" flood-opacity="0.14"/></filter><marker id="mGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,0.8 L9.4,5 L0.5,9.2 L3,5 Z" fill="#868e96"/></marker><marker id="mMaroon" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,0.8 L9.4,5 L0.5,9.2 L3,5 Z" fill="#7d1c1c"/></marker><marker id="mRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,0.8 L9.4,5 L0.5,9.2 L3,5 Z" fill="#e03131"/></marker><marker id="mGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,0.8 L9.4,5 L0.5,9.2 L3,5 Z" fill="#2f9e44"/></marker><marker id="mIndigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,0.8 L9.4,5 L0.5,9.2 L3,5 Z" fill="#4263eb"/></marker><marker id="mViolet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,0.8 L9.4,5 L0.5,9.2 L3,5 Z" fill="#7048e8"/></marker><marker id="mAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,0.8 L9.4,5 L0.5,9.2 L3,5 Z" fill="#f08c00"/></marker><marker id="mTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,0.8 L9.4,5 L0.5,9.2 L3,5 Z" fill="#0ca678"/></marker></defs><rect x="40" y="150" width="1010" height="540" rx="14" fill="#e7ecff" fill-opacity="0.05" stroke="#4263eb" stroke-width="1.4"><title>Deployed · shared its-reciter-vpc01 (TGW-attached) · 2 AZs · both envs</title></rect><rect x="70" y="196" width="960" height="106" rx="14" fill="#e7ecff" fill-opacity="0.12" stroke="#4263eb" stroke-width="1.4"><title>dmz tier · public (IGW)</title></rect><rect x="450" y="340" width="580" height="220" rx="14" fill="#e7ecff" fill-opacity="0.12" stroke="#4263eb" stroke-width="1.4"><title>app2 tier · /25</title></rect><rect x="70" y="340" width="340" height="220" rx="14" fill="#fff4d6" fill-opacity="0.12" stroke="#f08c00" stroke-width="1.4"><title>db tier · /27</title></rect><rect x="1078" y="196" width="306" height="320" rx="14" fill="#f1f3f5" fill-opacity="0.1" stroke="#adb5bd" stroke-width="1.4"><title>Beyond the VPC · WCM side</title></rect><path d="M160,61 C196,61 144,63 180,63" fill="none" stroke="#7d1c1c" stroke-width="1.8" stroke-linecap="round" marker-end="url(#mMaroon)"/>