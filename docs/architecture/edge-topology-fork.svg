<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 726" width="1400" height="726" role="img" aria-labelledby="t-edge-topology-fork d-edge-topology-fork" font-family="Inter,-apple-system,Segoe UI,Helvetica,Arial,sans-serif"><title id="t-edge-topology-fork">Edge topology — NetScaler live in both environments</title><desc id="d-edge-topology-fork">NetScaler is live in both environments (staging 2026-07-21, prod 2026-07-24). CloudFront sends every behaviour plus the default through the NetScaler VIP → app ALB, except /_next/static/*, which an origin group serves from a private S3 bucket (OAC, written additively by the deploy, 14-day lifecycle) and falls back to the ALB on 403/404 (#700). The origin leg is HTTPS-only (an HTTP origin behind the VIP's HTTP→HTTPS upgrade loops forever — the original ERR_TOO_MANY_REDIRECTS bug), and NetScaler dials the ALB on :443, forwarding the X-Origin-Verify header CloudFront injects. Durable in CDK via the #1507 origin-flip (PR #1852 staging, #1926 prod). The WAF runs the #461 WCM-only gate (branded 403), enforced AWS managed rules, Bot Control in label-only mode and a 5000/IP rate limit (branded 429), and it writes WAF logs. The cache key carries Next 16's _rsc param and the RSC/Next-Router-* headers (#2962/#2965). Writes that suppress, rename or revoke purge the edge through CreateInvalidation (#353/#828), and the cdn-reconcile ETL retries any purge still pending. Port corrected 2026-07-25 — this view previously said :80 and called the ALB :443 listener an unused guard; re-measurement (VPC flow logs + a timed causal probe) showed :443 is the live leg in both envs. The :443 TLS policy is now at parity — both envs carry the #1929 AEAD-only pin, staging deployed 2026-07-27 (#1937).</desc><rect width="100%" height="100%" fill="#fbfcfe"/><defs><filter id="sh" x="-25%" y="-25%" width="150%" height="150%"><feDropShadow dx="0" dy="1.4" stdDeviation="2.4" flood-color="#0b1f3a" flood-opacity="0.14"/></filter><marker id="mGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,0.8 L9.4,5 L0.5,9.2 L3,5 Z" fill="#868e96"/></marker><marker id="mMaroon" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,0.8 L9.4,5 L0.5,9.2 L3,5 Z" fill="#7d1c1c"/></marker><marker id="mRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,0.8 L9.4,5 L0.5,9.2 L3,5 Z" fill="#e03131"/></marker><marker id="mGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,0.8 L9.4,5 L0.5,9.2 L3,5 Z" fill="#2f9e44"/></marker><marker id="mIndigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,0.8 L9.4,5 L0.5,9.2 L3,5 Z" fill="#4263eb"/></marker><marker id="mViolet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,0.8 L9.4,5 L0.5,9.2 L3,5 Z" fill="#7048e8"/></marker><marker id="mAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,0.8 L9.4,5 L0.5,9.2 L3,5 Z" fill="#f08c00"/></marker><marker id="mTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,0.8 L9.4,5 L0.5,9.2 L3,5 Z" fill="#0ca678"/></marker></defs><rect x="40" y="120" width="660" height="510" rx="14" fill="#ebfbee" fill-opacity="0.05" stroke="#2f9e44" stroke-width="1.4"><title>Live request path · both envs</title></rect><rect x="740" y="120" width="620" height="510" rx="14" fill="#e7ecff" fill-opacity="0.04" stroke="#4263eb" stroke-width="1.4"><title>Where each environment stands · edge ops</title></rect><path d="M340,212 C340,248 340,204 340,240" fill="none" stroke="#868e96" stroke-width="1.8" stroke-linecap="round" marker-end="url(#mGray)"/><path d="M340,338 C340,374 340,348 340,384" fill="none" stroke="#7d1c1c" stroke-width="1.8" stroke-linecap="round" marker-end="url(#mMaroon)"/><path d="M490,289 L599,289 L599,384" fill="none" stroke="#f08c00" stroke-width="1.8" stroke-linecap="round" marker-end="url(#mAmber)"/><path d="M340,440 C340,476 340,442 340,478" fill="none" stroke="#868e96" stroke-width="1.8" stroke-linecap="round" marker-end="url(#mGray)"/><path d="M340,534 C340,570 340,532 340,568" fill="none" stroke="#868e96" stroke-width="1.8" stroke-linecap="round" marker-end="url(#mGray)"/><path d="M190,588 L110,588 L110,289 L190,289" fill="none" stroke="#0ca678" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="6 5" marker-end="url(#mTeal)"/><rect x="319.375" y="216.5" width="41.25" height="18" rx="9" fill="#ffffff" stroke="#868e96" stroke-opacity="0.45"/><text x="340" y="229.4" font-size="10" fill="#3a434f" text-anchor="middle">HTTPS</text><rect x="246.25" y="351.5" width="187.5" height="18" rx="9" fill="#ffffff" stroke="#7d1c1c" stroke-opacity="0.45"/><text x="340" y="364.4" font-size="10" fill="#3a434f" text-anchor="middle">default + dynamic · HTTPS-only</text><rect x="549.125" y="326.5" width="99.75" height="18" rx="9" fill="#ffffff" stroke="#f08c00" stroke-opacity="0.45"/><text x="599" y="339.4" font-size="10" fill="#3a434f" text-anchor="middle">/_next/static/*</text><rect x="269.65" y="449.5" width="140.7" height="18" rx="9" fill="#ffffff" stroke="#868e96" stroke-opacity="0.45"/><text x="340" y="462.4" font-size="10" fill="#3a434f" text-anchor="middle">:443 · X-Origin-Verify</text><rect x="316.45" y="541.5" width="47.099999999999994" height="18" rx="9" fill="#ffffff" stroke="#868e96" stroke-opacity="0.45"/><text x="340" y="554.4" font-size="10" fill="#3a434f" text-anchor="middle">to app</text><rect x="51.35" y="430.5" width="117.3" height="18" rx="9" fill="#ffffff" stroke="#0ca678" stroke-opacity="0.45"/><text x="110" y="443.4" font-size="10" fill="#3a434f" text-anchor="middle">CreateInvalidation</text><g><rect x="56" y="107" width="209.39999999999998" height="26" rx="8" fill="#ffffff" stroke="#2f9e44" stroke-width="1.2"/><text x="160.7" y="124.5" font-size="12" font-weight="700" fill="#256f33" text-anchor="middle">Live request path · both envs</text></g><g><rect x="756" y="107" width="282" height="26" rx="8" fill="#ffffff" stroke="#4263eb" stroke-width="1.2"/><text x="897" y="124.5" font-size="12" font-weight="700" fill="#2b3a8c" text-anchor="middle">Where each environment stands · edge ops</text></g><text x="40" y="40" font-size="12.5" font-weight="700" fill="#6a40c9" letter-spacing="0.5">EDGE TOPOLOGY · BOTH ENVS LIVE · staging 2026-07-21 · prod 2026-07-24 · #502</text><text x="40" y="74" font-size="22" font-weight="800" fill="#1f2933">Live (both envs): CloudFront + WAF → NetScaler → ALB → Fargate</text><rect x="1204" y="34" width="156" height="28" rx="14" fill="#f3eeff" stroke="#d6c9f0"/><text x="1282" y="52" font-size="11" font-weight="700" fill="#6a40c9" text-anchor="middle">BOTH ENVS LIVE</text><text x="64" y="152" font-size="11.5" fill="#6b7280">Static chunks from S3; everything else via NetScaler (HTTPS-only) → ALB :443</text><text x="760" y="152" font-size="11.5" fill="#6b7280">Same shape in both envs; :443 TLS policy at parity (#1937)</text><rect x="40" y="648" width="1320" height="62" rx="8" fill="#fbf7f0" stroke="#ece2cf"/><text x="58" y="668" font-size="11" fill="#5b4a20">#461 WCM-only WAF gate stays until NetScaler enforces equivalent filtering · :443 is the live origin leg in BOTH envs; the :80 listener remains but takes only scanner noise.</text><text x="58" y="685" font-size="11" fill="#5b4a20">WAF allow-list comes from an operator-seeded SSM StringList (#1506); the WebACL is always built, so a bare Edge deploy keeps the IPSet (#1856 closed).</text><text x="58" y="702" font-size="11" fill="#5b4a20">Common rule set enforced except SizeRestrictions_BODY / _QUERYSTRING (count) · cache policies key and forward _rsc, or Flight requests 307-loop (#2962/#2965).</text><g><title>Internet</title><rect x="190" y="172" width="300" height="40" rx="10" fill="#f1f3f5" stroke="#adb5bd" stroke-width="1.6" filter="url(#sh)"/><rect x="202" y="187" width="9" height="9" rx="2.5" fill="#868e96"/><text x="218" y="196" font-size="13.5" font-weight="700" fill="#343a40">Internet</text></g><g><title>CloudFront + AWS WAF — WCM-only IP gate (#461) → branded 403; Managed rules enforced · Bot Control label-only; 5000/IP rate limit → 429 · WAF logs; Cache key: _rsc + RSC/Next-Router-* (#2962)</title><rect x="190" y="240" width="300" height="98" rx="10" fill="#fbeaea" stroke="#7d1c1c" stroke-width="1.6" filter="url(#sh)"/><rect x="202" y="255" width="9" height="9" rx="2.5" fill="#7d1c1c"/><text x="218" y="264" font-size="13.5" font-weight="700" fill="#5e1414">CloudFront + AWS WAF</text><text x="204" y="281" font-size="11" fill="#5b6470">WCM-only IP gate (#461) → branded 403</text><text x="204" y="296" font-size="11" fill="#5b6470">Managed rules enforced · Bot Control label-only</text><text x="204" y="311" font-size="11" fill="#5b6470">5000/IP rate limit → 429 · WAF logs</text><text x="204" y="326" font-size="11" fill="#5b6470">Cache key: _rsc + RSC/Next-Router-* (#2962)</text></g><g><title>NetScaler VIP — AWS VPX · WCM edge layer</title><rect x="190" y="384" width="300" height="56" rx="10" fill="#f1f3f5" stroke="#adb5bd" stroke-width="1.6" filter="url(#sh)"/><rect x="202" y="399" width="9" height="9" rx="2.5" fill="#868e96"/><text x="218" y="408" font-size="13.5" font-weight="700" fill="#343a40">NetScaler VIP</text><text x="204" y="425" font-size="11" fill="#5b6470">AWS VPX · WCM edge layer</text><rect x="383.4" y="394" width="96.60000000000001" height="17" rx="8.5" fill="#f3eeff"/><text x="431.7" y="406" font-size="10" font-weight="700" fill="#6a40c9" text-anchor="middle">both envs live</text></g><g><title>S3 static assets — /_next/static/* · OAC; ALB fallback on 403/404; 14-day lifecycle</title><rect x="516" y="384" width="166" height="86" rx="10" fill="#fff4d6" stroke="#f08c00" stroke-width="1.6" filter="url(#sh)"/><rect x="528" y="399" width="9" height="9" rx="2.5" fill="#f08c00"/><text x="544" y="408" font-size="13.5" font-weight="700" fill="#8a5a00">S3 static assets</text><text x="530" y="425" font-size="11" fill="#5b6470">/_next/static/* · OAC</text><text x="530" y="440" font-size="11" fill="#5b6470">ALB fallback on 403/404</text><text x="530" y="455" font-size="11" fill="#5b6470">14-day lifecycle</text></g><g><title>Public ALB — :443 listener · X-Origin-Verify guard</title><rect x="190" y="478" width="300" height="56" rx="10" fill="#e7ecff" stroke="#4263eb" stroke-width="1.6" filter="url(#sh)"/><rect x="202" y="493" width="9" height="9" rx="2.5" fill="#4263eb"/><text x="218" y="502" font-size="13.5" font-weight="700" fill="#2b3a8c">Public ALB</text><text x="204" y="519" font-size="11" fill="#5b6470">:443 listener · X-Origin-Verify guard</text><rect x="436.5" y="488" width="43.5" height="17" rx="8.5" fill="#f3eeff"/><text x="458.25" y="500" font-size="10" font-weight="700" fill="#6a40c9" text-anchor="middle">stays</text></g><g><title>ECS Fargate app</title><rect x="190" y="568" width="300" height="40" rx="10" fill="#e3faf3" stroke="#0ca678" stroke-width="1.6" filter="url(#sh)"/><rect x="202" y="583" width="9" height="9" rx="2.5" fill="#0ca678"/><text x="218" y="592" font-size="13.5" font-weight="700" fill="#0b6e4f">ECS Fargate app</text></g><g><title>Staging — cut over &amp; live (2026-07-21) — Every behaviour + the default → NetScaler VIP → app ALB,; except /_next/static/* (S3 primary, ALB fallback, #700).; Origin leg HTTPS-only; NetScaler dials the ALB on :443 with X-Origin-Verify.; Durable in CDK: #1507 origin-flip seeded for staging (PR #1852).</title><rect x="760" y="176" width="580" height="100" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.6" filter="url(#sh)"/><rect x="772" y="191" width="9" height="9" rx="2.5" fill="#2f9e44"/><text x="788" y="200" font-size="13.5" font-weight="700" fill="#256f33">Staging — cut over &amp; live (2026-07-21)</text><text x="774" y="217" font-size="11" fill="#5b6470">Every behaviour + the default → NetScaler VIP → app ALB,</text><text x="774" y="232" font-size="11" fill="#5b6470">except /_next/static/* (S3 primary, ALB fallback, #700).</text><text x="774" y="247" font-size="11" fill="#5b6470">Origin leg HTTPS-only; NetScaler dials the ALB on :443 with X-Origin-Verify.</text><text x="774" y="262" font-size="11" fill="#5b6470">Durable in CDK: #1507 origin-flip seeded for staging (PR #1852).</text></g><g><title>Prod — cut over &amp; live (2026-07-24) — Same shape as staging: VIP origin HTTPS-only, same behaviour routing.; Prod VIP stood up by the WCM network team (RITM0801140); dials the ALB on :443.; Durable in CDK via #1926.; Both envs' :443 carry the #1929 AEAD-only TLS pin (#1937, 2026-07-27).</title><rect x="760" y="304" width="580" height="100" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.6" filter="url(#sh)"/><rect x="772" y="319" width="9" height="9" rx="2.5" fill="#2f9e44"/><text x="788" y="328" font-size="13.5" font-weight="700" fill="#256f33">Prod — cut over &amp; live (2026-07-24)</text><text x="774" y="345" font-size="11" fill="#5b6470">Same shape as staging: VIP origin HTTPS-only, same behaviour routing.</text><text x="774" y="360" font-size="11" fill="#5b6470">Prod VIP stood up by the WCM network team (RITM0801140); dials the ALB on :443.</text><text x="774" y="375" font-size="11" fill="#5b6470">Durable in CDK via #1926.</text><text x="774" y="390" font-size="11" fill="#5b6470">Both envs' :443 carry the #1929 AEAD-only TLS pin (#1937, 2026-07-27).</text></g><g><title>Edge cache purge — wired in both envs — App task role holds only cloudfront:CreateInvalidation.; Suppress / rename / revoke writes purge inline after commit (#353/#828).; The scholars-cdn-reconcile-&lt;env&gt; ETL task retries any pending purges.</title><rect x="760" y="432" width="580" height="86" rx="10" fill="#e3faf3" stroke="#0ca678" stroke-width="1.6" filter="url(#sh)"/><rect x="772" y="447" width="9" height="9" rx="2.5" fill="#0ca678"/><text x="788" y="456" font-size="13.5" font-weight="700" fill="#0b6e4f">Edge cache purge — wired in both envs</text><text x="774" y="473" font-size="11" fill="#5b6470">App task role holds only cloudfront:CreateInvalidation.</text><text x="774" y="488" font-size="11" fill="#5b6470">Suppress / rename / revoke writes purge inline after commit (#353/#828).</text><text x="774" y="503" font-size="11" fill="#5b6470">The scholars-cdn-reconcile-&lt;env&gt; ETL task retries any pending purges.</text></g></svg>